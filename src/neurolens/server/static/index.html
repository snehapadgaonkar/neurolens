<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroLens — evidence workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Section navigation">
    <div class="rail-mark">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="#146C70" stroke-width="1.4"/>
        <path d="M16 3v26M3 16h26" stroke="#D9E0E2" stroke-width="1"/>
        <path d="M8 20c3-6 6-8 8-8s5 2 8 8" fill="none" stroke="#17212B" stroke-width="1.6"/>
        <circle cx="12" cy="14" r="1.6" fill="#146C70"/>
        <circle cx="20" cy="14" r="1.6" fill="#5B4B8A"/>
      </svg>
      <span class="rail-title">NeuroLens</span>
    </div>
    <div id="nav-groups"></div>
    <div class="rail-foot">
      <span class="rail-version">v0.1.0 · research prototype</span>
    </div>
  </nav>

  <div class="content">
    <header class="topbar">
      <button class="rail-toggle" id="rail-toggle" aria-expanded="false"
              aria-controls="rail">Menu</button>
      <div class="run-context" id="run-context" aria-live="polite">
        <span class="ctx-label">Run</span>
        <select id="run-select" aria-label="Select run"></select>
      </div>
      <div class="provenance-strip" id="provenance-strip"></div>
    </header>

    <div class="research-banner" role="note">
      <strong>Research prototype.</strong>
      <span id="research-notice"></span>
    </div>

    <main id="main" tabindex="-1">
      <div class="state-panel" id="boot">
        <p>Loading run artifacts…</p>
      </div>
    </main>

    <footer class="page-foot">
      <span>NeuroLens — auditable AI for neurodegenerative progression.</span>
      <span class="mono" id="foot-hash"></span>
    </footer>
  </div>
</div>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-panel">
    <div class="drawer-head">
      <h2 id="drawer-title">Details</h2>
      <button class="icon-btn" id="drawer-close" aria-label="Close details">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>

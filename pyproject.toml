[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolens"
version = "0.1.0"
description = "Auditable AI for Huntington's disease progression under genetic and demographic distribution shift"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sneha Padgaonkar" }]
keywords = [
  "huntington-disease",
  "clinical-ai",
  "fairness",
  "uncertainty",
  "explainability",
  "neuroimaging",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.26"]

[project.scripts]
neurolens = "neurolens.cli:main"

[project.urls]
Homepage = "https://github.com/snehapadgaonkar/neurolens"
Repository = "https://github.com/snehapadgaonkar/neurolens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurolens = ["server/static/*", "server/static/**/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: long-running end-to-end checks"]

[tool.ruff]
line-length = 100
target-version = "py39"
